services:
  app:
    build: .
    container_name: casper-blog
    restart: unless-stopped
    ports:
      # 宿主 44200（避开 aura-web 的 44100 / aura-api 8081 / xiaoliang 3000）；容器内 44100
      - "127.0.0.1:44200:44100"
    networks:
      - 1panel-network
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - NODE_ENV=production
      - PORT=44100
      - SITE_URL=https://blog.example.com
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:44100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  1panel-network:
    external: true
